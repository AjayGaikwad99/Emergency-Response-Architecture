# Use your installed JDK (update path if needed)
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.9.10-hotspot

# JVM arguments tuned for Gradle + Kotlin
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable AndroidX and Jetifier (required for modern Flutter plugins)
android.useAndroidX=true
android.enableJetifier=true

# Improve build performance
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Kotlin daemon stability (disable incremental compilation if caches corrupt often)
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.useClasspathSnapshot=true

# Ensure reproducible builds
org.gradle.daemon=true
