name: fire_alert_app
description: Fire Alert app for users and brigades (Android-first)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2


  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  fluttertoast: ^9.0.0
  shared_preferences: ^2.0.0


  geolocator: ^9.0.2
  google_maps_flutter: ^2.4.0

  image_picker: ^1.2.1
  path_provider: ^2.0.15
  video_player: ^2.6.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  location: ^8.0.1
  intl: ^0.20.2


  camera: ^0.10.5
  flutter_compass: ^0.8.0

  sensors_plus: ^7.0.0
  vector_math: ^2.1.0


  speech_to_text: ^7.3.0

 
  flutter_sound: ^9.2.13
  dtd: ^4.0.0
  google_fonts: ^8.0.0
  json_rpc_2: ^4.0.0
  path: ^1.9.1
  stack_trace: ^1.12.1
  url_launcher: ^6.3.2
  android_intent_plus: ^6.0.0
  web: ^1.1.1
  animated_text_kit: ^4.2.2
  lottie: ^3.3.2


  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  image: ^4.0.15

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/animations/Fire.json
    - assets/animations/Fireman using hose.json
    - assets/animations/Fireman using whistle.json
    - assets/fire_detection_model.tflite